<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171c26"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Дом Полуночи"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>Хроника Дома Полуночи · Alpha 0.4.1</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark;--bg:#171c26;--panel:#222b3a;--line:#38445b;--text:#f2f3f8;--muted:#aab4c7;--accent:#aaa5ef}body{margin:0;background:var(--bg);color:var(--text)}body.light{color-scheme:light;--bg:#f8f9fb;--panel:#fff;--line:#dce0e8;--text:#242b39;--muted:#69768b;--accent:#6659bb}button,input{font:inherit}button{cursor:pointer}header{display:flex;align-items:center;justify-content:space-between;padding:22px 26px;border-bottom:1px solid var(--line)}h1{font-size:20px;margin:4px 0}small,.muted{color:var(--muted)}.shell{display:flex;max-width:1300px;margin:auto;min-height:80vh}nav{width:245px;flex-shrink:0;padding:22px 12px;border-right:1px solid var(--line)}nav button{display:block;width:100%;text-align:left;border:0;border-radius:10px;background:transparent;color:var(--text);padding:12px 15px;margin-bottom:3px}nav button.active,nav button:hover{background:var(--panel);color:var(--accent)}main{flex:1;min-width:0;padding:28px}h2{margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:20px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin:12px 0}.card h3{margin:0 0 8px;font-size:17px}.card p{line-height:1.55;margin:8px 0}input{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text)}.badge{display:inline-block;color:var(--accent);font-size:13px;margin:5px 0}#theme{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:9px 12px;border-radius:9px}.bottom{display:none}@media(max-width:750px){header{padding:16px}header h1{font-size:16px}.shell{display:block}nav{display:none}main{padding:18px 16px 95px}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;justify-content:space-around;background:var(--panel);border-top:1px solid var(--line);padding:10px 3px max(10px,env(safe-area-inset-bottom))}.bottom button{background:none;border:0;color:var(--text);font-size:12px;padding:9px 4px}.bottom button.active{color:var(--accent)}} 
</style></head><body><header><div><small>КАМПАНИЯ · 7723 ГОД</small><h1>☾ Хроника Дома Полуночи</h1></div><button id="theme" aria-label="Переключить тему">◐ Тема</button></header><div class="shell"><nav id="nav"></nav><main><div id="app"></div></main></div><div class="bottom" id="bottom"></div>
<script>
const sections=['Хроника','Персонажи','Связи','Места','Фракции','Расследования','Квесты','Предметы','Поиск','Герои партии','Литературная хроника','Цитаты','Казна','Галерея','Резервные копии'];
const sessions=[['20','Сердце бури','07.11.2025','Дворец Дюн. Освободили немого товарища. Во время эксперимента Ёвиса Тарвин погиб.'],['19','Жест приветствия','01.11.2025','1 августа. Освобождён багбир Хрегор, который показал свой жест приветствия.'],['18','Поиски товарищей','24.10.2025','27 июля. Отправились за товарищами. Упомянуты Сиг Мурт и Томас.'],['17','Совет Дома Полуночи','17.10.2025','26 июля. Совет в Доме Полуночи: Арик Гесто, Джонатан Фризо, Ферандо Бэк, Илсон Грей.'],['16','Пленник говорит — Аркас','10.10.2025','21 июля. Форт Корнвелл. Пленный маг повторяет «Аркас».'],['15','Логово циклопа','03.10.2025','20 июля. Найдена надпись «Архафен». Побеждён циклоп.']];
const people=['Дэмиен','Магнус','Тарвин','Кэлинор','Ёвис','Леди Элдрика Вейн','Джонатан Фризо','Ферандо Бэк','Хрегор'];
const places=['Вестфилд','Лисья Нора','Каэр Даген','Вольхейм','Ингхольд','Рейнвели','Форт Корнвелл','Дворец Дюн'];
let section='Хроника';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function card(title,body,meta=''){return '<article class="card"><span class="badge">'+esc(meta)+'</span><h3>'+esc(title)+'</h3><p>'+esc(body)+'</p></article>'}
function render(){document.getElementById('nav').innerHTML=sections.map(s=>'<button data-s="'+esc(s)+'" class="'+(s===section?'active':'')+'">'+esc(s)+'</button>').join('');document.getElementById('bottom').innerHTML=['Хроника','Персонажи','Связи','Поиск','Ещё'].map(s=>'<button data-s="'+esc(s)+'" class="'+(s===section?'active':'')+'">'+esc(s)+'</button>').join('');let body='<h2>'+esc(section)+'</h2>';if(section==='Хроника')body+='<p class="muted">Последние сессии · реальные даты указаны отдельно от игровых</p>'+sessions.map(x=>card('№'+x[0]+' · '+x[1],x[3],'Дата игры: '+x[2])).join('');else if(section==='Персонажи'||section==='Герои партии')body+='<div class="grid">'+(section==='Персонажи'?people:people.slice(0,4)).map(x=>card(x,'Досье будет дополнено по записям кампании.')).join('')+'</div>';else if(section==='Места')body+='<div class="grid">'+places.map(x=>card(x,'Сведения уточняются по хронике.')).join('')+'</div>';else if(section==='Поиск')body+='<input id="query" placeholder="Имя, место, событие…"><div id="results"></div>';else if(section==='Резервные копии')body+=card('Локальная тестовая версия','Полноценный импорт и экспорт появятся в следующем обновлении.');else body+=card('Раздел в разработке','Навигация работает. Содержимое и интерактивные инструменты будут добавлены по мере разработки Alpha 0.1.');document.getElementById('app').innerHTML=body;document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{section=b.dataset.s==='Ещё'?'Места':b.dataset.s;window.render()});const q=document.getElementById('query');if(q)q.oninput=()=>{let v=q.value.toLowerCase().trim();document.getElementById('results').innerHTML=v?[...people,...places,...sessions.map(s=>s[1])].filter(x=>x.toLowerCase().includes(v)).map(x=>card(x,'Найдено в хронике')).join('')||'<p class="muted">Ничего не найдено</p>':''}}
document.getElementById('theme').onclick=()=>{document.body.classList.toggle('light');localStorage.setItem('theme',document.body.classList.contains('light')?'light':'dark')};if(localStorage.getItem('theme')==='light')document.body.classList.add('light');render();
</script><script>
/* Alpha 0.1.1: локальные заметки и резервное копирование */
(function(){
const KEY='hom-local-notes-v1';
let notes=[];
try{const saved=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(saved))notes=saved;}catch(e){}
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(notes));return true}catch(e){alert('Не удалось сохранить. Проверьте свободное место браузера.');return false}};
const view=()=>{
const root=document.getElementById('app');if(!root)return;
root.innerHTML='<h2>Мои заметки</h2><p class="muted">Записи хранятся только в этом браузере. Для переноса на другое устройство скачайте резервную копию.</p><div class="card"><label>Название заметки<input id="note-title" maxlength="150" placeholder="Например: Вопросы к следующей сессии"></label><label style="display:block;margin-top:12px">Текст<textarea id="note-body" rows="6" style="width:100%;box-sizing:border-box;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:8px" placeholder="Запишите наблюдения…"></textarea></label><button id="note-add" style="margin-top:12px;padding:10px 16px;border-radius:9px;border:1px solid var(--line);background:var(--accent);color:#171c26">Сохранить заметку</button></div><div class="card"><h3>Резервные копии</h3><button id="note-export">Скачать JSON</button> <label style="display:inline-block;margin-top:12px">Восстановить из файла <input id="note-import" type="file" accept="application/json,.json"></label><p class="muted">Импорт заменяет только локальные заметки, не записи кампании.</p></div><div id="note-list"></div>';
root.querySelector('#note-add').onclick=()=>{const title=root.querySelector('#note-title').value.trim(),body=root.querySelector('#note-body').value.trim();if(!title&&!body){alert('Введите название или текст.');return}notes.unshift({id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),title:title||'Без названия',body,createdAt:new Date().toISOString()});if(save())view()};
root.querySelector('#note-export').onclick=()=>{const blob=new Blob([JSON.stringify({format:'house-of-midnight-notes',version:1,notes},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='dom-polunochi-zametki.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
root.querySelector('#note-import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2000000)throw Error('Файл слишком большой');const d=JSON.parse(await file.text());if(d.format!=='house-of-midnight-notes'||!Array.isArray(d.notes)||d.notes.length>5000||!d.notes.every(n=>n&&typeof n.id==='string'&&typeof n.title==='string'&&typeof n.body==='string'))throw Error('Неподходящий формат');if(!confirm('Заменить '+notes.length+' локальных заметок данными из файла?'))return;notes=d.notes.map(n=>({id:n.id,title:n.title,body:n.body,createdAt:n.createdAt||''}));if(save())view()}catch(err){alert('Ошибка импорта: '+err.message)}};
const list=root.querySelector('#note-list');list.innerHTML=notes.length?notes.map(n=>'<article class="card"><h3>'+safe(n.title)+'</h3><p style="white-space:pre-wrap">'+safe(n.body)+'</p><small class="muted">'+safe(n.createdAt.slice(0,10))+'</small> <button data-delete="'+safe(n.id)+'">Удалить</button></article>').join(''):'<p class="muted">Заметок пока нет.</p>';
list.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Удалить заметку?')){notes=notes.filter(n=>n.id!==b.dataset.delete);if(save())view()}});
};
const addNav=()=>{const nav=document.getElementById('nav');if(!nav||nav.querySelector('#notes-nav'))return;const b=document.createElement('button');b.id='notes-nav';b.textContent='✎ Мои заметки';b.onclick=()=>{document.querySelectorAll('#nav button,.bottom button').forEach(x=>x.classList.remove('active'));b.classList.add('active');view()};nav.appendChild(b)};
const originalRender=window.render;if(typeof originalRender==='function'){window.render=function(){originalRender();addNav()}}addNav();
})();
</script><script src="./timeline.js?v=0.4.1"></script><script src="./core.js?v=0.4.1"></script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}</script></body></html>
